name: 시장 전망 업데이트

on:
  schedule:
    - cron: "0 22 * * 0-4"   # 한국시간 월~금 오전 7시
    - cron: "30 7 * * 1-5"   # 한국시간 월~금 오후 4시 30분 (국장 마감 후)
  workflow_dispatch:          # 아이폰에서 수동 실행

permissions:
  contents: write

concurrency:
  group: market-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python market_forecast.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "update $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
          git push
