<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>시장 전망</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="시장 전망">
<meta name="theme-color" content="#f2f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101013" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#f2f4f6; --card:#ffffff; --ink:#191f28; --ink2:#4e5968; --sub:#8b95a1; --faint:#c5ccd3;
  --line:#f2f4f6; --chip:#f2f4f6; --seg:#e5e8eb; --press:#f9fafb; --blue:#3182f6;
  --up:#f04452; --down:#3182f6; --flat:#8b95a1; --gold:#ffb800;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#101013; --card:#1c1c21; --ink:#f2f4f6; --ink2:#c1c7cd; --sub:#8b95a1; --faint:#4a4f57;
    --line:#26262d; --chip:#2a2a31; --seg:#26262d; --press:#24242a; --blue:#4b93ff;
    --up:#f45b69; --down:#4b93ff; --flat:#7d8590;
    color-scheme:dark;
  }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--bg); color:var(--ink); font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:15px; line-height:1.5; letter-spacing:-.01em; font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); background:var(--bg); z-index:30}
button{font:inherit; color:inherit; touch-action:manipulation}
a{color:inherit; text-decoration:none}
:focus-visible{outline:2px solid var(--blue); outline-offset:2px; border-radius:8px}

.view{max-width:560px; margin:0 auto; padding:calc(env(safe-area-inset-top,0px) + 18px) 16px calc(env(safe-area-inset-bottom,0px) + 100px)}
.view[hidden]{display:none}
.top{padding:6px 6px 4px}
.top h1{font-size:26px; font-weight:800; letter-spacing:-.03em; margin:0}
.meta{font-size:13px; color:var(--sub); margin-top:4px}
.badge{display:inline-block; font-size:11px; font-weight:700; padding:2px 7px; border-radius:6px; background:var(--seg); color:var(--ink2); margin-left:4px; vertical-align:1px}
.badge.demo{background:var(--up); color:#fff}

.card{background:var(--card); border-radius:22px; padding:20px; margin-top:12px}
.card.tight{padding:6px 0 8px}
.ct{display:flex; align-items:center; gap:6px; font-size:17px; font-weight:700; margin:0 0 14px}
.card.tight .ct{padding:14px 20px 6px; margin:0}
.ct .cap{margin-left:auto; font-size:13px; font-weight:500; color:var(--sub)}
.q{display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; padding:0; border-radius:50%; border:0; background:var(--chip); color:var(--sub); font-size:12px; font-weight:700; cursor:pointer}
.hint{font-size:13px; color:var(--sub); text-align:center; margin:18px 8px 0}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}
.bg-up{background:var(--up)} .bg-down{background:var(--down)} .bg-flat{background:var(--faint)}
.stale{margin-top:12px; padding:12px 16px; border-radius:16px; font-size:14px; background:color-mix(in srgb,var(--up) 10%,var(--card))}

.mood{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.mood > div{background:var(--chip); border-radius:16px; padding:14px 14px 12px; cursor:pointer; transition:transform .12s}
.mood > div:active{transform:scale(.97)}
.mood small{display:block; font-size:13px; color:var(--sub); font-weight:600}
.mood b{display:block; font-size:22px; font-weight:800; letter-spacing:-.02em; margin:2px 0 4px}
.mood span{font-size:12px; color:var(--sub)}
.macro{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.macro > div{cursor:pointer}
.macro small{display:block; font-size:12px; color:var(--sub)}
.macro b{display:block; font-size:18px; font-weight:700; margin-top:2px}
.macro i{font-style:normal; font-size:12px; font-weight:600}
.al{display:flex; gap:10px; align-items:flex-start; padding:10px 0; font-size:15px; border-top:1px solid var(--line)}
.al:first-of-type{border-top:0; padding-top:0}
.al::before{content:""; flex:none; width:6px; height:6px; border-radius:50%; background:var(--up); margin-top:8px}

.li{display:flex; align-items:center; gap:12px; padding:12px 20px; cursor:pointer; transition:background .15s}
.li:active{background:var(--press)}
.ico{flex:none; width:40px; height:40px; border-radius:50%; background:var(--chip); display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700; color:var(--ink2); line-height:1.1; text-align:center}
.ico.date{border-radius:12px; font-size:12px; flex-direction:column}
.ico.date small{font-size:10px; color:var(--sub); font-weight:600}
.tx{flex:1; min-width:0}
.t1{font-size:16px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.t2{font-size:13px; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.rv{text-align:right; flex:none}
.r1{font-size:16px; font-weight:700}
.r2{font-size:13px; color:var(--sub)}
.sub-h{font-size:13px; font-weight:600; color:var(--sub); padding:10px 20px 2px}

.mhead{position:sticky; top:env(safe-area-inset-top,0px); z-index:10; background:var(--bg); margin:0 -16px; padding:8px 16px 6px}
.seg{display:flex; background:var(--seg); border-radius:12px; padding:4px}
.seg button{flex:1; border:0; background:none; min-height:40px; border-radius:9px; font-weight:700; color:var(--sub); cursor:pointer; transition:background .2s,color .2s}
.seg button[aria-pressed=true]{background:var(--card); color:var(--ink); box-shadow:0 1px 4px rgba(0,0,0,.08)}
.hz{display:flex; gap:6px; margin-top:8px}
.hz button{flex:1; border:0; background:var(--card); color:var(--sub); min-height:36px; border-radius:999px; font-size:14px; font-weight:600; cursor:pointer; transition:background .2s,color .2s}
.hz button[aria-pressed=true]{background:var(--ink); color:var(--card)}
.hz .fav{flex:0 0 44px; font-size:15px}
.hz .fav[aria-pressed=true]{background:var(--gold); color:#fff}
.tally{display:flex; align-items:center; gap:4px; font-size:13px; color:var(--sub); margin:8px 4px 0}
.tally b{color:var(--ink)}

.asset{padding:16px 20px; cursor:pointer; transition:background .15s}
.asset:active{background:var(--press)}
.asset + .asset{border-top:1px solid var(--line)}
.ah{display:flex; align-items:center; gap:6px}
.ah .nm{font-size:17px; font-weight:700}
.px{margin-left:auto; font-size:14px; color:var(--sub); white-space:nowrap}
.px b{color:var(--ink); font-weight:600; margin-right:4px}
.star{border:0; background:none; padding:6px; margin:-6px -2px -6px -6px; font-size:18px; line-height:1; color:var(--faint); cursor:pointer}
.star[aria-pressed=true]{color:var(--gold)}
.av{display:flex; align-items:center; gap:14px; margin-top:12px}
.prob{min-width:66px; font-size:30px; font-weight:800; letter-spacing:-.03em; line-height:1}
.prob small{display:block; font-size:12px; font-weight:700; letter-spacing:0; margin-top:6px}
.gauge{flex:1; min-width:0}
.track{position:relative; height:6px; border-radius:3px; background:var(--chip)}
.track::after{content:""; position:absolute; left:50%; top:-3px; width:2px; height:12px; margin-left:-1px; border-radius:1px; background:var(--faint)}
.fill{position:absolute; top:0; height:100%; border-radius:3px}
.rng{display:flex; justify-content:space-between; gap:6px; white-space:nowrap; font-size:12px; color:var(--sub); margin-top:8px}
.rng b{font-weight:700}
.spark{flex:none}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px}
.chip{border:0; background:var(--chip); color:var(--ink2); font-size:12px; font-weight:500; padding:5px 10px; border-radius:999px; cursor:pointer}
.subpicks{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
.sp{border:1px solid var(--seg); background:none; border-radius:999px; padding:4px 10px; font-size:12px; color:var(--ink2); cursor:pointer}
.sp b{margin-left:2px}
.empty{padding:28px 20px; text-align:center; color:var(--sub); font-size:14px}

.map svg{display:block; width:100%; height:auto}
.map g{cursor:pointer}
.mapcap{font-size:12px; color:var(--sub); margin-top:4px; text-align:center}

.tot{display:flex; align-items:baseline; gap:8px; padding:6px 0}
.tot small{font-size:14px; color:var(--sub); min-width:72px}
.tot b{font-size:22px; font-weight:800; letter-spacing:-.02em}
.tot span{font-size:14px; font-weight:600}
.del{flex:none; border:0; background:none; color:var(--faint); font-size:20px; min-width:32px; min-height:40px; margin-right:-8px; cursor:pointer}
.btn{display:block; width:100%; min-height:54px; margin-top:12px; border:0; border-radius:16px; background:var(--blue); color:#fff; font-size:16px; font-weight:700; cursor:pointer; transition:transform .12s, opacity .12s}
.btn:active{transform:scale(.98); opacity:.9}

.kv{display:flex; justify-content:space-between; gap:12px; padding:12px 0; border-top:1px solid var(--line); font-size:15px}
.kv:first-of-type{border-top:0; padding-top:0}
.kv > span:last-child{text-align:right}
.kv small{font-size:12px; color:var(--sub)}
.note{font-size:13px; color:var(--sub); margin:12px 0 0; line-height:1.6}
.term{border:0; background:none; padding:0; font:inherit; color:inherit; cursor:pointer; text-decoration:underline dotted; text-underline-offset:3px; text-decoration-color:var(--faint)}
.lh{font-size:15px; font-weight:700; margin:20px 0 8px}
.lnk{display:flex; align-items:center; gap:12px; padding:14px 20px; font-size:16px; font-weight:500; cursor:pointer; width:100%; border:0; background:none; text-align:left}
.lnk:active{background:var(--press)}
.lnk .ico{width:36px; height:36px; font-size:16px}
.lnk::after{content:"›"; margin-left:auto; color:var(--faint); font-size:22px; line-height:1}
.gloss details{padding:14px 20px; border-top:1px solid var(--line)}
.gloss details:first-of-type{border-top:0}
.gloss summary{list-style:none; cursor:pointer; font-size:16px; font-weight:600; display:flex}
.gloss summary::-webkit-details-marker{display:none}
.gloss summary::after{content:"＋"; margin-left:auto; color:var(--faint)}
.gloss details[open] summary::after{content:"－"}
.gb h4,#sheetBody h4{font-size:13px; font-weight:700; color:var(--sub); margin:16px 0 6px}
.gb p,#sheetBody p{margin:0; font-size:15px; line-height:1.65}
.gb ul,#sheetBody ul{margin:0; padding-left:18px; font-size:15px; line-height:1.65}
.gb li,#sheetBody li{margin:4px 0}
footer{font-size:12px; color:var(--sub); line-height:1.6; margin:20px 6px 0}

.tabbar{position:fixed; left:0; right:0; bottom:0; z-index:20; display:flex; justify-content:center;
  background:color-mix(in srgb,var(--card) 86%,transparent); -webkit-backdrop-filter:saturate(180%) blur(18px); backdrop-filter:saturate(180%) blur(18px);
  border-top:1px solid var(--line); padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar .in{display:flex; width:100%; max-width:560px}
.tabbar button{flex:1; border:0; background:none; display:flex; flex-direction:column; align-items:center; gap:3px; min-height:50px; padding:4px 0; color:var(--faint); font-size:11px; font-weight:600; cursor:pointer; transition:color .2s}
.tabbar button[aria-current=page]{color:var(--ink)}
.tabbar svg{width:24px; height:24px; fill:currentColor}

dialog#sheet{border:0; padding:0; margin:auto auto 0; width:100%; max-width:560px; max-height:86vh; border-radius:24px 24px 0 0; background:var(--card); color:var(--ink); overflow:auto}
dialog#sheet::backdrop{background:rgba(0,0,0,.4)}
.sheet-in{padding:10px 20px calc(28px + env(safe-area-inset-bottom,0px))}
.grab{width:36px; height:5px; border-radius:3px; background:var(--seg); margin:0 auto 12px}
.sheet-head{display:flex; align-items:center; gap:10px}
.sheet-head h3{flex:1; margin:0; font-size:20px; font-weight:800; letter-spacing:-.02em}
#sheetClose,#sheetBack{border:0; background:var(--chip); color:var(--ink); border-radius:999px; min-width:36px; min-height:36px; padding:0 14px; font-size:14px; font-weight:600; cursor:pointer}
#sheetBack{padding:0; font-size:16px}
#sheetBack[hidden]{display:none}
@media (prefers-reduced-motion:no-preference){
  dialog#sheet[open]{animation:up .24s cubic-bezier(.2,.8,.2,1)}
  .view{animation:fade .2s ease-out}
}
@keyframes up{from{transform:translateY(40px); opacity:0}to{transform:none; opacity:1}}
@keyframes fade{from{opacity:.4}to{opacity:1}}
.small{font-size:13px; color:var(--sub)}
.dtable{width:100%; border-collapse:collapse; font-size:14px}
.dtable th,.dtable td{padding:8px 4px; border-top:1px solid var(--line); text-align:right}
.dtable th:first-child,.dtable td:first-child{text-align:left}
.dtable th{font-size:12px; color:var(--sub); font-weight:600; border-top:0}
.chart{display:block; width:100%; height:auto; margin-top:4px}
.legend{font-size:12px; color:var(--sub); margin-top:4px}
.legend i{display:inline-block; width:12px; height:3px; border-radius:2px; vertical-align:middle; margin:0 4px 0 10px}
.legend i:first-child{margin-left:0}
.flowt{font-size:13px; width:100%; border-collapse:collapse}
.flowt td{padding:4px 2px; text-align:right}
.flowt td:first-child{text-align:left; color:var(--sub)}
.news{margin:6px 0 0; padding-left:18px; font-size:14px; color:var(--ink2)}
.news li{margin:6px 0}
.form label{display:block; font-size:13px; font-weight:600; color:var(--sub); margin:16px 0 6px}
.form select,.form input{width:100%; min-height:50px; font:inherit; font-size:17px; padding:10px 14px; border:0; border-radius:14px; background:var(--chip); color:var(--ink)}
</style>
</head>
<body>
<section class="view" id="v-today"></section>
<section class="view" id="v-market" hidden>
  <div class="top"><h1>시장</h1></div>
  <div class="mhead">
    <div class="seg" id="mk">
      <button data-v="KR" aria-pressed="true">국장</button>
      <button data-v="US" aria-pressed="false">미장</button>
    </div>
    <div class="hz" id="hz">
      <button data-v="day" aria-pressed="true">1일</button>
      <button data-v="week" aria-pressed="false">1주</button>
      <button data-v="month" aria-pressed="false">1개월</button>
      <button data-v="year" aria-pressed="false">1년</button>
      <button class="fav" id="favOnly" aria-pressed="false" aria-label="관심만 보기">★</button>
    </div>
    <div class="tally" id="tally"></div>
  </div>
  <div id="marketBody"></div>
</section>
<section class="view" id="v-mine" hidden></section>
<section class="view" id="v-more" hidden></section>

<nav class="tabbar" aria-label="화면 이동"><div class="in">
  <button data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.6 12 3.5l9 7.1V20a1 1 0 0 1-1 1h-5.5v-6h-5v6H4a1 1 0 0 1-1-1z"/></svg>오늘</button>
  <button data-tab="market"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20v-8.5h3.4V20zm6.3 0V4h3.4v16zm6.3 0v-11.5H20V20z"/></svg>시장</button>
  <button data-tab="mine"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 3.05A9 9 0 1 0 20.95 13H11z"/><path d="M13 2.05V11h8.95A9 9 0 0 0 13 2.05z"/></svg>내 종목</button>
  <button data-tab="more"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/></svg>더보기</button>
</div></nav>

<dialog id="sheet" aria-labelledby="sheetTitle">
  <div class="sheet-in">
    <div class="grab"></div>
    <div class="sheet-head"><button id="sheetBack" hidden aria-label="뒤로">←</button><h3 id="sheetTitle"></h3><button id="sheetClose">닫기</button></div>
    <div id="sheetBody"></div>
  </div>
</dialog>

<script>
const D = __DATA__;
const store = {
  get(k, d){ try { const v = localStorage.getItem("mf:" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem("mf:" + k, JSON.stringify(v)); } catch {} }
};
let mk = store.get("mk", "KR"), hz = store.get("hz", "day"), favOnly = store.get("favOnly", false), tab = store.get("tab", "today");
const favs = new Set(store.get("favs", []));
let holds = store.get("hold", []);
let sheetStack = [];
const $ = id => document.getElementById(id);
const key = a => a.market + ":" + a.ticker;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const pct = (x, d = 1) => (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(x * 100).toFixed(d) + "%";
const tone = x => x > 0.0005 ? "up" : x < -0.0005 ? "down" : "flat";
const num = x => x.toLocaleString("ko-KR", {maximumFractionDigits: x < 100 ? 2 : 0});
const verdict = p => p >= .55 ? ["상승 우위", "up"] : p <= .45 ? ["하락 우위", "down"] : ["중립", "flat"];
const HZN = {day: "1일", week: "1주", month: "1개월", year: "1년"};
const MKN = {KR: "국장", US: "미장"};
const ALL = [...D.assets, ...(D.stocks || [])];
const byKey = Object.fromEntries(ALL.map(a => [key(a), a]));
const money = (v, m) => m === "KR" ? Math.round(v).toLocaleString("ko-KR") + "원" : "$" + v.toLocaleString("en-US", {maximumFractionDigits: 2});
const qtyFmt = v => (v > 0 ? "+" : v < 0 ? "−" : "") + (Math.abs(v) >= 10000 ? (Math.abs(v) / 10000).toFixed(1) + "만" : Math.abs(v).toLocaleString("ko-KR"));
const ico = name => `<span class="ico" aria-hidden="true">${esc([...String(name)][0] || "")}</span>`;
const pp = p => Math.round(p * 100) + "%";

function spark(a){
  const w = 64, h = 32, mn = Math.min(...a), mx = Math.max(...a), r = (mx - mn) || 1;
  const pts = a.map((v, i) => (i / (a.length - 1) * w).toFixed(1) + "," + (h - (v - mn) / r * (h - 2) - 1).toFixed(1)).join(" ");
  const c = a[a.length - 1] >= a[0] ? "var(--up)" : "var(--down)";
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="최근 3달 추이"><polyline points="${pts}" fill="none" stroke="${c}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

function signals(a){
  const s = a.signals, rsi = a.rsi;
  const t = s.trend >= .99 ? "정배열" : s.trend <= -.99 ? "역배열" : "혼조";
  const r = rsi >= 70 ? "과열" : rsi <= 30 ? "침체" : "보통";
  const n = s.news > .15 ? "긍정" : s.news < -.15 ? "부정" : "중립";
  const m = s.mom > .3 ? "강함" : s.mom < -.3 ? "약함" : "보통";
  return `<button class="chip" data-term="news">뉴스 ${n}</button><button class="chip" data-term="trend">이평선 ${t}</button><button class="chip" data-term="mom">모멘텀 ${m}</button><button class="chip" data-term="rsi">RSI ${rsi} ${r}</button>` +
    (a.flows ? `<button class="chip" data-term="flow">수급 ${s.flow > .2 ? "매수 우위" : s.flow < -.2 ? "매도 우위" : "중립"}</button>` : "");
}

function stockLi(s, lead, h = hz){
  const f = s.forecast[h], c = verdict(f.p_up)[1];
  return `<div class="li" data-detail="${esc(key(s))}" role="button" tabindex="0">${lead}<div class="tx"><div class="t1">${esc(s.name)}</div><div class="t2">${esc(s.sector || s.group || "")} · ${num(s.last)} <span class="${tone(s.chg1d)}">${pct(s.chg1d, 2)}</span></div></div><div class="rv"><div class="r1 ${c}">${pp(f.p_up)}</div><div class="r2">예상 ${pct(f.exp)}</div></div></div>`;
}

function sectorPicks(a){
  if (a.group !== "섹터") return "";
  const s = (D.stocks || []).filter(x => x.market === a.market && x.sector === a.name)
    .sort((x, y) => y.forecast[hz].p_up - x.forecast[hz].p_up).slice(0, 3);

function mapCard(){
  const s = D.assets.filter(a => a.market === mk && a.rs);
  if (!s.length) return "";
  const W = 340, H = 250, P = 16;
  const mx = Math.max(.02, ...s.map(a => Math.abs(a.rs.x))) * 1.2, my = Math.max(.02, ...s.map(a => Math.abs(a.rs.y))) * 1.2;
  const X = v => W / 2 + v / mx * (W / 2 - P), Y = v => H / 2 - v / my * (H / 2 - P);
  const quad = [["선두", W - 6, 14, "end"], ["식는 중", W - 6, H - 6, "end"], ["살아나는 중", 6, 14, "start"], ["약세", 6, H - 6, "start"]]
    .map(([t, x, y, an]) => `<text x="${x}" y="${y}" text-anchor="${an}" font-size="11" font-weight="600" fill="var(--sub)">${t}</text>`).join("");
  const placed = [];
  const dots = s.map(a => ({a, x: X(a.rs.x), y: Y(a.rs.y)})).sort((p, q) => p.y - q.y).map(({a, x, y}) => {
    const w = a.name.length * 12 + 4, pref = x > W * .62 ? -1 : 1;
    const cands = [[pref, 4], [-pref, 4], [pref, -10], [pref, 18], [-pref, -10], [-pref, 18]].map(([d, dy]) => [d, d > 0 ? x + 11 : x - 11 - w, y + dy]);
    const free = c => c[1] >= 0 && c[1] + w <= W && !placed.some(b => c[1] < b[1] && c[1] + w > b[0] && Math.abs(c[2] - b[2]) < 14);
    const [dir, x0, ly] = cands.find(free) || cands[0], right = dir < 0;
    placed.push([x0, x0 + w, ly]);
    const c = a.rs.x >= 0 ? (a.rs.y >= 0 ? "var(--up)" : "#ff9f1a") : (a.rs.y >= 0 ? "#1fc28b" : "var(--down)");
    return `<g data-detail="${esc(key(a))}"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="8" fill="${c}"/><text x="${(right ? x - 11 : x + 11).toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${right ? "end" : "start"}" font-size="12" font-weight="600" fill="var(--ink)">${esc(a.name)}</text></g>`;
  }).join("");
  return `<div class="card map"><div class="ct">섹터 흐름 지도 <button class="q" data-term="map" aria-label="섹터 흐름 지도 설명">?</button></div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="섹터 흐름 지도"><rect x="${W / 2}" y="0" width="${W / 2}" height="${H / 2}" rx="12" fill="var(--up)" opacity=".05"/><line x1="${W / 2}" y1="2" x2="${W / 2}" y2="${H - 2}" stroke="var(--seg)" stroke-width="1.5"/><line x1="2" y1="${H / 2}" x2="${W - 2}" y2="${H / 2}" stroke="var(--seg)" stroke-width="1.5"/>${quad}${dots}</svg><div class="mapcap">가로: 최근 3달 시장 대비 · 세로: 최근 1달 시장 대비</div></div>`;
}

function smaS(c, n){ return c.map((_, i) => i < n - 1 ? null : c.slice(i - n + 1, i + 1).reduce((s, v) => s + v, 0) / n); }
function rsiS(c, n = 14){ return c.map((_, i) => { if (i < n) return null; let g = 0, l = 0; for (let j = i - n + 1; j <= i; j++){ const d = c[j] - c[j - 1]; if (d > 0) g += d; else l -= d; } return l === 0 ? 100 : 100 - 100 / (1 + g / l); }); }
function pathD(v, X, Y){ let d = "", on = false; v.forEach((y, i) => { if (y == null) { on = false; return; } d += (on ? "L" : "M") + X(i).toFixed(1) + "," + Y(y).toFixed(1); on = true; }); return d; }
function priceChart(c){
  const W = 340, H = 170, n = c.length, m20 = smaS(c, 20), m60 = smaS(c, 60);
  const all = c.concat(m20.filter(v => v != null), m60.filter(v => v != null));
  const lo = Math.min(...all), hi = Math.max(...all), r = (hi - lo) || 1;
  const X = i => i / (n - 1) * W, Y = v => H - 4 - (v - lo) / r * (H - 8);
  const col = c[n - 1] >= c[0] ? "var(--up)" : "var(--down)";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 1년 가격과 이동평균선"><path d="${pathD(c, X, Y)}L${W},${H}L0,${H}Z" fill="${col}" opacity=".08"/><path d="${pathD(c, X, Y)}" fill="none" stroke="${col}" stroke-width="1.8" stroke-linejoin="round"/><path d="${pathD(m20, X, Y)}" fill="none" stroke="var(--ink2)" stroke-width="1" stroke-dasharray="3 3"/><path d="${pathD(m60, X, Y)}" fill="none" stroke="var(--sub)" stroke-width="1"/></svg><div class="legend"><i style="background:${col}"></i>가격<i style="background:var(--ink2)"></i>20일 평균<i style="background:var(--sub)"></i>60일 평균</div>`;
}
function rsiChart(c){
  const W = 340, H = 64, v = rsiS(c), n = c.length, X = i => i / (n - 1) * W, Y = x => H - x / 100 * H;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="RSI 추이"><rect x="0" y="0" width="${W}" height="${Y(70)}" fill="var(--up)" opacity=".1"/><rect x="0" y="${Y(30)}" width="${W}" height="${H - Y(30)}" fill="var(--down)" opacity=".1"/><path d="${pathD(v, X, Y)}" fill="none" stroke="var(--ink2)" stroke-width="1.4"/></svg><div class="legend">위 빨간 띠: 70 이상 과열 · 아래 파란 띠: 30 이하 침체</div>`;
}
function openDetail(k){

  const rows = Object.entries(HZN).map(([h, n]) => { const f = a.forecast[h], c = verdict(f.p_up)[1];

    what: "앞으로 30일 안에 시장을 크게 움직일 수 있는 일정이에요. 미국 금리 결정, 미국 물가 발표, 한국 금리 결정, 대표 종목 실적 발표를 보여줘요.",
    easy: "시험 날짜표예요. 결과가 나오는 날엔 점수(주가)가 크게 바뀔 수 있어요.",
    read: ["일정 당일과 전날에는 주가가 평소보다 크게 흔들리기 쉬워요. 이 화면의 확률도 그날은 덜 믿는 게 좋아요.", "미국 일정은 한국 시간으로 밤이나 새벽에 나와서, 국장에는 다음 날 반영돼요.", "D-숫자는 오늘부터 남은 날수예요.", "일정을 누르면 그 일정이 무엇인지, 실적 발표는 해당 종목 상세 화면이 열려요."]},
  fomc: {t: "FOMC (미국 금리 결정)",
    what: "미국 중앙은행(연준)이 기준금리를 올릴지, 내릴지, 그대로 둘지 정하는 회의예요. 1년에 8번 열려요.",
    easy: "전 세계 돈값을 정하는 회의예요. 미국 금리가 바뀌면 대출 이자, 환율, 주가가 한꺼번에 움직여요.",
    read: ["금리 인하(또는 인하 신호): 보통 주식, 특히 기술주에 좋아요.", "금리 인상(또는 인상 신호): 보통 주식에 부담이에요.", "결과보다 '예상과 달랐는지'가 더 중요해요. 모두 예상한 결과면 조용히 지나가기도 해요.", "한국 시간으로 새벽 3~4시에 발표돼요. 표시된 날짜는 한국 날짜 기준이에요."]},
  cpi: {t: "CPI (미국 소비자물가)",
    what: "미국의 물가가 1년 전보다 얼마나 올랐는지 보여주는 지표예요. 매달 한 번 발표돼요.",
    easy: "장바구니 가격표예요. 물가가 많이 오르면 연준이 금리를 내리기 어려워져요.",
    read: ["예상보다 물가가 높게 나오면: 금리 인하가 늦어질 수 있어 주가에 부담이에요.", "예상보다 낮게 나오면: 금리 인하 기대로 주가에 좋은 경우가 많아요.", "한국 시간 밤 9시 30분(여름) 또는 10시 30분(겨울)에 발표돼요."]},
  bok: {t: "금통위 (한국 금리 결정)",
    what: "한국은행 금융통화위원회가 한국의 기준금리를 정하는 회의예요. 1년에 8번 열려요.",
    easy: "한국판 FOMC예요. 대출 이자와 예금 이자의 기준이 정해져요.",
    read: ["금리 인하는 보통 국장에 좋고, 금리 인상은 부담이에요.", "다만 한국만 금리를 내리면 원화가 약해질(환율 상승) 수 있어 외국인 자금 흐름도 함께 봐야 해요.", "오전에 결과가 나오고, 오전 11시쯤 총재 기자간담회가 있어요."]},
  earn: {t: "실적 발표",
    what: "회사가 지난 3개월 동안 얼마를 벌었는지 공개하는 날이에요. 1년에 4번 있어요.",
    easy: "회사의 성적표가 나오는 날이에요.",
    read: ["실적 자체보다 '시장 예상보다 좋았나 나빴나'에 따라 주가가 움직여요.", "발표 전후로 주가가 하루에 5~10%씩 움직이기도 해요.", "이 화면의 확률은 실적 결과를 모르는 상태에서 계산한 거라, 발표 직전에는 특히 참고만 하세요.", "미국 종목 날짜는 미국 날짜 기준이에요."]},
  hold: {t: "내 보유 종목",
    what: "내가 가진 종목과 평균 매수가를 입력해 두면 현재 수익률과 이 화면의 전망을 함께 보여줘요.",
    easy: "내 가계부의 주식 칸이에요.",
    read: ["수익률 = 현재가 ÷ 평균 매수가 − 1 이에요.", "수량을 넣으면 평가손익(지금 팔면 얼마 벌거나 잃는지)도 보여줘요.", "입력한 정보는 이 기기 안에만 저장되고 GitHub에도, 인터넷 어디에도 올라가지 않아요.", "홈 화면 앱과 Safari는 저장 공간이 따로예요. 한쪽에서만 입력하세요.", "목록에 없는 종목은 stocks.csv에 추가하면 고를 수 있어요. × 버튼으로 지울 수 있어요."]},
  strong: {t: "강한 신호 적중률",
    what: "상승 확률을 55% 이상 또는 45% 이하로, 즉 '어느 한쪽으로 꽤 기울었다'고 예측한 경우만 모아서 계산한 적중률이에요.",
    easy: "일기예보가 '비 올 확률 80%'라고 자신 있게 말했을 때 얼마나 맞았는지 따로 보는 거예요.",
    read: ["전체 적중률보다 이게 더 중요해요. 이 도구를 '언제 믿을지' 알려주거든요.", "강한 신호 적중률이 전체보다 높으면: 상승·하락 우위가 뜬 항목 위주로 보면 돼요.", "비슷하거나 낮으면: 확률 숫자 차이에 큰 의미를 두지 마세요.", "20건 이상 쌓여야 표시돼요."]},
  weights: {t: "가중치 학습",
    what: "뉴스·RSI·모멘텀·추세·수급 중 어떤 신호를 얼마나 믿을지 정하는 비율이에요. 채점된 기록이 200건 쌓이면 실제로 잘 맞은 신호의 비중을 자동으로 키워요.",
    easy: "여러 친구에게 조언을 듣다가, 자주 맞힌 친구 말에 더 귀 기울이게 되는 것과 같아요.",
    read: ["'학습 대기'는 아직 기록이 부족해서 기본 비율을 쓰는 중이라는 뜻이에요.", "'자동 조정 중'이 되면 매일 최신 기록으로 비율을 다시 계산해요.", "한 신호에 너무 쏠리지 않도록 기본 비율의 0.3배~2배 안에서만 바뀌어요.", "1년 전망은 채점에 1년이 걸려서 기본 비율을 그대로 써요."]},
  alert: {t: "오늘의 알림",
    what: "그날 눈여겨볼 변화를 자동으로 골라 보여줘요. 공포지수 급등, 하루 큰 폭 등락, 1주 전망 방향 전환, 오늘·내일 주요 일정이 해당돼요.",
    easy: "아침에 누가 '오늘 이거 하나는 알고 가'라고 짚어주는 메모예요.",
    read: ["지수·섹터는 하루 ±3%, 종목은 ±5% 넘게 움직이면 알려줘요.", "VIX가 25를 넘으면 알려줘요.", "아이폰 푸시 알림을 켜두면 같은 내용이 폰으로도 와요."]}
};
const GLOSS_ORDER = ["prob", "range", "price", "horizon", "trend", "mom", "rsi", "news", "flow", "map", "picks", "hold", "events", "fomc", "cpi", "bok", "earn", "alert", "acc", "strong", "weights", "vix", "fx", "rate"];
function glossBody(g){
  return `<h4>무슨 뜻이에요?</h4><p>${g.what}</p><h4>쉽게 말하면</h4><p>${g.easy}</p><h4>이렇게 보세요</h4><ul>${g.read.map(x => `<li>${x}</li>`).join("")}</ul>`;
}
function openTerm(k){ const g = GLOSS[k]; if (g) openSheet(g.t, glossBody(g)); }

// ───────── 탭 · 이벤트 ─────────
function renderAll(){ renderToday(); renderMarket(); renderMine(); }
function setTab(t){
  tab = ["today", "market", "mine", "more"].includes(t) ? t : "today"; store.set("tab", tab);
  ["today", "market", "mine", "more"].forEach(v => $("v-" + v).hidden = v !== tab);
  document.querySelectorAll(".tabbar button").forEach(b => b.dataset.tab === tab ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  window.scrollTo(0, 0);
}
document.addEventListener("click", e => {
  const T = sel => e.target.closest(sel);
  let el;
  if ((el = T("#sheetBack"))) { const p = sheetStack.pop(); if (p) { $("sheetTitle").textContent = p[0]; $("sheetBody").innerHTML = p[1]; } el.hidden = !sheetStack.length; return; }
  if (T("#sheetClose")) { $("sheet").close(); return; }
  if ((el = T("[data-tab]"))) { setTab(el.dataset.tab); return; }
  if ((el = T("[data-fav]"))) { const k = el.dataset.fav; favs.has(k) ? favs.delete(k) : favs.add(k); store.set("favs", [...favs]); renderMarket(); renderMine(); return; }
  if ((el = T("[data-term]")) && el.dataset.term) { e.preventDefault(); openTerm(el.dataset.term); return; }
  if ((el = T("[data-go]"))) { if (el.dataset.mk) { mk = el.dataset.mk; store.set("mk", mk); renderMarket(); } setTab(el.dataset.go); return; }
  if ((el = T("[data-addhold]"))) { holdForm(el.dataset.addhold); return; }
  if ((el = T("[data-del]"))) {
    const h = holds[+el.dataset.del], a = h && byKey[h.k];
    if (confirm(`${a ? a.name : "이 종목"}을(를) 목록에서 지울까요?`)) { holds.splice(+el.dataset.del, 1); store.set("hold", holds); renderMine(); }
    return;
  }
  if ((el = T("[data-detail]"))) { openDetail(el.dataset.detail); return; }
  if (T("#addHold")) { holdForm(); return; }
  if (T("#hsave")) {
    const k = $("hk").value, avg = parseFloat($("ha").value), qty = parseFloat($("hq").value);
    if (!(avg > 0)) { alert("평균 매수가를 입력해 주세요."); return; }
    holds.push({k, avg, qty: qty > 0 ? qty : 0}); store.set("hold", holds); $("sheet").close(); renderMine(); setTab("mine"); return;
  }
  if (T("#reload")) { location.replace(location.pathname + "?t=" + Date.now()); return; }
  if ((el = T("#mk button"))) { mk = el.dataset.v; store.set("mk", mk); renderMarket(); return; }
  if ((el = T("#hz button[data-v]"))) { hz = el.dataset.v; store.set("hz", hz); renderMarket(); renderMine(); return; }
  if (T("#favOnly")) { favOnly = !favOnly; store.set("favOnly", favOnly); renderMarket(); return; }
});
document.addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const el = e.target.closest && e.target.closest("[role=button][tabindex]");
  if (el && el.tagName !== "BUTTON") { e.preventDefault(); el.click(); }
});
$("sheet").addEventListener("close", () => { sheetStack = []; });
$("sheet").addEventListener("click", e => { if (e.target === $("sheet")) $("sheet").close(); });
let sx = 0, sy = 0;
document.addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive: true});
document.addEventListener("touchend", e => {
  if (tab !== "market" || $("sheet").open) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
  const next = dx < 0 ? "US" : "KR"; if (next === mk) return;
  mk = next; store.set("mk", mk); renderMarket();
}, {passive: true});

renderAll();
renderMore();
setTab(tab);
</script>
</body>
</html>
